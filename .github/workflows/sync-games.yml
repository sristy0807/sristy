name: Sync games

# Copies the latest version of each game (listed in sync-games.json)
# from its own repo into games/<folder>/ and publishes the site.
on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy game files
        run: |
          set -e
          jq -c '.games[]' sync-games.json | while read -r g; do
            folder=$(echo "$g" | jq -r .folder)
            repo=$(echo "$g" | jq -r .repo)
            mkdir -p "games/$folder"
            for f in $(echo "$g" | jq -r '.files[]'); do
              echo "↓ $repo/$f → games/$folder/$f"
              curl -fsSL "https://raw.githubusercontent.com/$repo/main/$f" -o "games/$folder/$f"
            done
          done
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add games
          if git diff --cached --quiet; then echo "Games already up to date."; else git commit -m "Sync games from their repos" && git push; fi
