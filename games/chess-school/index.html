<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>Chess School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet club room. IDEA: a walnut board box with a parchment score sheet.
   COLOUR: walnut #2b1d14, parchment #f4ead6, brass #c9a227, board cream #f0d9b5 / brown #b58863.
   TYPE: Playfair Display for titles, Source Sans 3 for play. LAYOUT: board is the hero; panels around it. */
:root{--walnut:#2b1d14;--walnut2:#3b2a1d;--grain:#4a3424;--parch:#f4ead6;--parch2:#e9dcc2;--ink:#2b1d14;--muted:#6f5b47;--brass:#c9a227;--brass2:#e2c15a;
  --light:#f0d9b5;--dark:#b58863;--last:rgba(205,210,90,.55);--sel:rgba(120,170,60,.6);--good:#3f7d3a;--bad:#a23b2a;--sq:56px;--r:14px;
  --serif:"Playfair Display",Georgia,serif;--sans:"Source Sans 3",system-ui,sans-serif}
:root[data-board=green]{--light:#eeeed2;--dark:#769656}
:root[data-board=marble]{--light:#e8e6e1;--dark:#8c8a86}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--walnut) radial-gradient(120% 80% at 50% 0%,var(--grain),var(--walnut) 70%);color:var(--parch);font:17px/1.5 var(--sans);-webkit-tap-highlight-color:transparent;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 23px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.sq:focus-visible{outline:3px solid var(--brass2);outline-offset:2px}
#app{position:relative;max-width:1100px;margin:0 auto;min-height:100dvh;padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),14px) max(env(safe-area-inset-bottom),12px) max(env(safe-area-inset-left),14px)}
h1,h2,h3{font-family:var(--serif);line-height:1.1;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid rgba(244,234,214,.35);background:rgba(244,234,214,.06);font-weight:600}
.btn:hover{border-color:var(--brass2)}
.btn.icon{width:44px;padding:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.primary{min-height:50px;padding:10px 24px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--brass2),var(--brass));color:var(--walnut);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.primary:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--brass2);text-decoration:underline;text-underline-offset:3px;padding:8px 0;min-height:44px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar .grow{flex:1;font:700 19px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(244,234,214,.25);border-radius:999px;padding:6px 14px;font-weight:700;min-height:40px}
.chip .st{color:var(--brass2)}
.sheet{background:var(--parch) linear-gradient(180deg,rgba(255,255,255,.35),transparent 40%);color:var(--ink);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(43,29,20,.15)}
.sheet .muted,.muted{color:var(--muted)}
/* menu */
.menu{min-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.menubar{display:flex;align-items:center;gap:8px}
.menumain{flex:1;display:grid;align-content:center;justify-items:center;gap:clamp(18px,4vh,40px);padding:10px 0}
.brand{text-align:center;display:grid;justify-items:center}
.crest{width:clamp(110px,30vw,170px);aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);border:6px solid var(--walnut2);outline:2px solid var(--brass);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);position:relative;margin-bottom:18px;transform:rotate(-4deg)}
.crest i{background:var(--light)}.crest i:nth-child(8n+2),.crest i:nth-child(8n+4),.crest i:nth-child(8n+5),.crest i:nth-child(8n+7){background:var(--dark)}
.crest svg{position:absolute;width:62%;left:19%;bottom:14%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.logo{font:800 clamp(46px,12vw,84px)/.95 var(--serif);letter-spacing:-.01em}
.logo em{font-style:italic;color:var(--brass2)}
.tag{margin:.4em 0 0;color:#d8c8ac}.tag .bn{display:block;font-size:1.25em;color:var(--parch)}
.menubtns{display:grid;gap:12px;width:min(100%,390px)}
.mbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:12px 20px;border-radius:16px;border:1.5px solid rgba(244,234,214,.22);background:rgba(244,234,214,.07);font:700 19px var(--sans);text-align:left}
.mbtn small{font-weight:500;font-size:14px;color:#d8c8ac;text-align:right}
.mbtn:hover:not(:disabled){border-color:var(--brass2)}
.mbtn:disabled{opacity:.45;cursor:not-allowed}
.mbtn.play{background:linear-gradient(180deg,var(--brass2),var(--brass));color:var(--walnut);border:0;min-height:76px;font:800 28px var(--serif);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.mbtn.play small{color:rgba(43,29,20,.8);font-family:var(--sans);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick .mbtn{flex-direction:column;align-items:flex-start;gap:0;font-size:17px}
.quick .mbtn small{text-align:left}
/* overlay + modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,10,6,.65);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{width:min(100%,480px);max-height:90dvh;overflow:auto;padding:22px}
.modal h2{font-size:26px;margin-bottom:8px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.modal .btn{border-color:rgba(43,29,20,.3);background:rgba(43,29,20,.04)}
.modal .mbtn{border-color:rgba(43,29,20,.2);background:#fff8ea;color:var(--ink);width:100%;margin-top:10px}
.modal .mbtn{flex-direction:column;align-items:flex-start;gap:2px}.modal .mbtn small{color:var(--muted);display:block;text-align:left;font-weight:500}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(43,29,20,.15)}
.seg{display:flex;flex-wrap:wrap;background:rgba(43,29,20,.07);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;min-height:38px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle{width:56px;height:32px;border-radius:999px;border:0;background:#cbbba0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:var(--good)}.toggle[aria-pressed=true]::after{transform:translateX(24px)}
.danger{color:var(--bad)!important}
/* levels */
.chapter{padding:16px clamp(12px,3vw,24px) 18px;margin-bottom:14px}
.chap{display:flex;align-items:center;gap:10px;font-size:22px;margin-bottom:14px}
.chap small{margin-left:auto;font:600 14px var(--sans);color:var(--muted)}
.chap svg{width:34px;height:34px}
.track{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));position:relative;gap:6px}
.track::before{content:"";position:absolute;left:calc(50%/var(--k));right:calc(50%/var(--k));top:31px;height:3px;background:rgba(43,29,20,.2)}
.node{background:none;border:0;padding:0;display:grid;justify-items:center;gap:6px;text-align:center;color:var(--ink)}
.disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 22px var(--serif);background:#fff8ea;border:3px solid rgba(43,29,20,.25);position:relative;z-index:1}
.node.done .disc{background:var(--walnut);color:var(--brass2);border-color:var(--brass)}
.node.now .disc{border-color:var(--brass);box-shadow:0 0 0 6px rgba(201,162,39,.25);animation:breathe 1.6s ease-in-out infinite}
.node.locked{cursor:not-allowed}.node.locked .disc{opacity:.5}
.node .nt{font-weight:700;font-size:13px;line-height:1.2;max-width:12ch}
.node .stars{font-size:13px;color:#a8830f;letter-spacing:1px}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes fade{from{opacity:0}}
/* lesson */
.lesson{padding:22px;max-width:680px;margin:0 auto}
.lesson h2{font-size:30px;margin-bottom:10px}
.lesson p{margin:.6em 0}
.lesson .demo{display:flex;justify-content:center;margin:14px 0}
.lesson .demo .board{--sq:clamp(30px,9vw,44px)}
.lesson .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
</style>
<style>
/* board */
.board{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));border:calc(var(--sq)*.14) solid var(--walnut2);border-radius:6px;outline:2px solid var(--brass);box-shadow:0 20px 50px rgba(0,0,0,.55);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;background:var(--light);border:0;padding:0;display:block}
.sq.d{background:var(--dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sel)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(220,30,20,.95) 0,rgba(220,30,20,.5) 40%,transparent 72%)}
.sq.tgt::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(30,20,10,.28)}
.sq.tgt.cap::after{width:88%;height:88%;margin:-44% 0 0 -44%;background:none;border:calc(var(--sq)*.08) solid rgba(30,20,10,.28)}
.sq.goal::after{content:"";position:absolute;inset:18%;border-radius:50%;border:3px dashed rgba(43,29,20,.55)}
.sq.flash{animation:flash .6s}
@keyframes flash{50%{box-shadow:inset 0 0 0 999px rgba(63,125,58,.55)}}
.sq.err{animation:err .5s}
@keyframes err{50%{box-shadow:inset 0 0 0 999px rgba(162,59,42,.55)}}
.coord{position:absolute;font:700 max(10px,calc(var(--sq)*.2))/1 var(--sans);pointer-events:none;color:var(--dark)}
.sq.d .coord{color:var(--light)}
.coord.f{right:4%;bottom:3%}.coord.r{left:5%;top:4%}
.pc{position:absolute;inset:4%;z-index:2;pointer-events:none;transition:transform .18s ease-out}
.pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 calc(var(--sq)*.04) calc(var(--sq)*.03) rgba(0,0,0,.35))}
.pc.drag{transition:none;z-index:9}
.board.flip{direction:ltr}
/* piece colours */
.pw .b{fill:#fbf6ea;stroke:#2a1d12}.pw .l{stroke:#2a1d12;fill:none}.pw .e{fill:#2a1d12}
.pb .b{fill:#2b2018;stroke:#0d0805}.pb .l{stroke:#e9dcc2;fill:none}.pb .e{fill:#e9dcc2}
.pw path,.pb path,.pw circle,.pb circle{stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
/* play layout */
.play{display:grid;gap:10px;justify-items:center}
.strip{display:flex;align-items:center;gap:10px;width:calc(var(--sq)*8.28);min-height:40px}
.strip .who{font-weight:700;white-space:nowrap}
.strip .who small{font-weight:500;color:#d8c8ac;margin-left:4px}
.strip .caps{flex:1;display:flex;flex-wrap:wrap;gap:0;justify-content:flex-end;align-items:center;min-height:24px}
.strip .caps svg{width:22px;height:22px;margin-left:-6px}
.strip .adv{font-weight:700;color:var(--brass2);margin-left:4px;font-size:14px}
.strip.turn .who::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brass2);margin-right:8px;box-shadow:0 0 0 4px rgba(226,193,90,.25)}
.side{display:grid;gap:10px;width:calc(var(--sq)*8.28)}
.status{min-height:26px;text-align:center;font-weight:600;color:#ecdfc6}
.status.warn{color:#ffb4a2}
.ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.moves{padding:10px 12px;font:15px/1.6 var(--sans);max-height:30dvh;overflow:auto;display:none}
.moves ol{margin:0;padding-left:2.2em;columns:2;column-gap:20px}
.moves li{break-inside:avoid}
.moves b{font-weight:700}
.moves .cur{background:rgba(201,162,39,.35);border-radius:4px;padding:0 3px}
.movesline{width:calc(var(--sq)*8.28);overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-size:14px;color:#d8c8ac;min-height:22px}
.movesline::-webkit-scrollbar{display:none}
.movesline span{margin-right:8px}.movesline .n{color:#9d8a70}
.goalcard{width:calc(var(--sq)*8.28);padding:12px 16px;display:flex;gap:12px;align-items:center}
.goalcard .txt{flex:1}.goalcard b{font-size:17px}.goalcard .muted{font-size:14px}
.goalcard .count{font:800 26px var(--serif);text-align:center;line-height:1}.goalcard .count small{display:block;font:600 12px var(--sans);color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(244,234,214,.25)}.dots i.g{background:#7fbf6a}.dots i.r{background:#e07a62}.dots i.now{background:var(--brass2)}
.promo{display:flex;gap:10px;justify-content:center;margin-top:12px}
.promo button{width:72px;height:72px;border-radius:14px;border:2px solid rgba(43,29,20,.2);background:#fff8ea}
.promo svg{width:56px;height:56px}
.bigstars{font-size:46px;color:#a8830f;letter-spacing:6px;text-align:center;margin:6px 0}
.result-txt{text-align:center}
@media(orientation:landscape) and (min-width:700px){
  .play{grid-template-columns:auto minmax(250px,340px);grid-template-areas:"board top" "board side" "board bot";grid-template-rows:auto 1fr auto;align-items:start;justify-content:center;column-gap:22px;row-gap:10px}
  .play>.board{grid-area:board}
  .play>.strip.top,.play>.goalcard{grid-area:top;width:100%}
  .play>.strip.bot,.play>.ctrls{grid-area:bot;width:100%}
  .play>.side,.play>.status{grid-area:side;width:100%;align-self:stretch;align-content:start}
  .play .moves{display:block;max-height:none;min-height:90px;flex:1}
  .play .side{display:flex;flex-direction:column;min-height:0}
  .play .movesline{display:none}
}
@media(orientation:landscape) and (max-height:560px){
  .menumain{grid-template-columns:1fr 1fr;align-items:center}
  .crest{width:clamp(80px,22vh,130px);margin-bottom:10px}
  .logo{font-size:clamp(38px,11vh,64px)}
  .mbtn{min-height:46px;padding:8px 16px;font-size:17px}.mbtn.play{min-height:56px;font-size:24px}
  .menubtns,.quick{gap:8px}
  #app{padding-top:max(env(safe-area-inset-top),6px)}
  .topbar{margin-bottom:4px}.topbar .btn{min-height:38px}
  .moves{font-size:14px}
}
@media(min-width:760px){.menumain{grid-template-columns:1.1fr 1fr;align-items:center}}
@media(max-width:420px){.backlbl{display:none}.topbar .dots{order:9;width:100%;justify-content:center}.topbar{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--np-bg:#2b1d14;--np-fg:#f4ead6;--np-acc:#e2c15a}
#np{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;top:max(env(safe-area-inset-top),10px);transform:translateY(-160%);z-index:60;display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;border-radius:999px;background:var(--np-bg);color:var(--np-fg);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .5s cubic-bezier(.2,.9,.3,1.15);max-width:min(92vw,420px);font-family:var(--np-font,inherit)}
#np.np-show{transform:none}#np.np-hide{transform:translateY(-160%)}
.np-ic{font-size:20px;color:var(--np-acc);animation:npb .9s ease-in-out infinite;flex:none}
@keyframes npb{50%{transform:translateY(-3px) rotate(-8deg)}}
.np-t{display:grid;line-height:1.15;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.np-t small{font-size:11px;opacity:.75;font-weight:700}
.np-skip{flex:none;border:0;border-radius:999px;padding:6px 12px;min-height:36px;background:var(--np-acc);color:var(--np-bg);font:800 14px system-ui,sans-serif;cursor:pointer}
.mus-off{opacity:.45}
@media(prefers-reduced-motion:reduce){#np{transition:none}.np-ic{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
/* ---------- chess rules engine ----------
   Board: 64 squares, index = row*8+col, row 0 is rank 8 (top, black's back rank).
   Pieces: 'P','N','B','R','Q','K' white, lowercase black, null empty. */
const FILES='abcdefgh';
const sqName=i=>FILES[i%8]+(8-(i>>3));
const sqIdx=n=>(8-+n[1])*8+FILES.indexOf(n[0]);
const colorOf=p=>p?(p===p.toUpperCase()?'w':'b'):null;
const opp=c=>c==='w'?'b':'w';
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

function parseFEN(f){const [pos,turn,cas,ep,half,full]=f.trim().split(/\s+/);const b=[];
  for(const ch of pos.replace(/\//g,''))if(/\d/.test(ch))for(let i=0;i<+ch;i++)b.push(null);else b.push(ch);
  return {b,turn:turn||'w',castle:{K:/K/.test(cas||''),Q:/Q/.test(cas||''),k:/k/.test(cas||''),q:/q/.test(cas||'')},ep:ep&&ep!=='-'?sqIdx(ep):-1,half:+half||0,full:+full||1};}
function toFEN(s){let out='';for(let r=0;r<8;r++){let e=0;for(let c=0;c<8;c++){const p=s.b[r*8+c];if(!p)e++;else{if(e)out+=e;e=0;out+=p;}}if(e)out+=e;if(r<7)out+='/';}
  const cas=(s.castle.K?'K':'')+(s.castle.Q?'Q':'')+(s.castle.k?'k':'')+(s.castle.q?'q':'')||'-';
  return `${out} ${s.turn} ${cas} ${s.ep>=0?sqName(s.ep):'-'} ${s.half} ${s.full}`;}

const DIRS={N:[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],B:[[-1,-1],[-1,1],[1,-1],[1,1]],R:[[-1,0],[1,0],[0,-1],[0,1]]};
DIRS.Q=DIRS.B.concat(DIRS.R);DIRS.K=DIRS.Q;
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;

function attacked(b,sq,by){const r=sq>>3,c=sq%8;
  const pr=by==='w'?r+1:r-1,P=by==='w'?'P':'p';
  for(const dc of[-1,1])if(inB(pr,c+dc)&&b[pr*8+c+dc]===P)return true;
  const up=x=>by==='w'?x.toUpperCase():x.toLowerCase();
  for(const[dr,dc]of DIRS.N){const rr=r+dr,cc=c+dc;if(inB(rr,cc)&&b[rr*8+cc]===up('n'))return true;}
  for(const[dr,dc]of DIRS.K){const rr=r+dr,cc=c+dc;if(inB(rr,cc)&&b[rr*8+cc]===up('k'))return true;}
  for(const[dr,dc]of DIRS.B){let rr=r+dr,cc=c+dc;while(inB(rr,cc)){const p=b[rr*8+cc];if(p){if(p===up('b')||p===up('q'))return true;break;}rr+=dr;cc+=dc;}}
  for(const[dr,dc]of DIRS.R){let rr=r+dr,cc=c+dc;while(inB(rr,cc)){const p=b[rr*8+cc];if(p){if(p===up('r')||p===up('q'))return true;break;}rr+=dr;cc+=dc;}}
  return false;}
const kingSq=(b,c)=>b.indexOf(c==='w'?'K':'k');
const inCheck=(s,c=s.turn)=>{const k=kingSq(s.b,c);return k>=0&&attacked(s.b,k,opp(c));};

function pseudo(s){const b=s.b,me=s.turn,out=[];
  for(let i=0;i<64;i++){const p=b[i];if(!p||colorOf(p)!==me)continue;const t=p.toUpperCase(),r=i>>3,c=i%8;
    if(t==='P'){const d=me==='w'?-1:1,start=me==='w'?6:1,last=me==='w'?0:7,r1=r+d;
      const push=(to,cap,flag)=>{if((to>>3)===last)for(const pr of'QRBN')out.push({from:i,to,piece:p,cap,promo:me==='w'?pr:pr.toLowerCase(),flag});else out.push({from:i,to,piece:p,cap,flag});};

/* ---------- puzzles ---------- */
const nextTurnWhite=s=>({...s,turn:'w',ep:-1});
function collectPar(lv){/* BFS: fewest moves to capture every target (and promote if asked) */
  const s0=parseFEN(lv.fen),key=s=>s.b.map(p=>p||'.').join(''),seen=new Set([key(s0)]);let q=[s0],d=0;
  const done=s=>!s.b.includes('p')&&(!lv.promote||s.b.includes('Q'));
  while(q.length&&d<14){const nq=[];for(const s of q){if(done(s))return d;
    for(const m of legalMoves(s)){if(m.promo&&m.promo!=='Q')continue;const n=nextTurnWhite(makeMove(s,m)),k=key(n);if(!seen.has(k)){seen.add(k);nq.push(n);}}}q=nq;d++;}
  return d;}
function loadFind(){const pz=cur.puzzles[P.i];P.pz=typeof pz==='string'?{fen:pz}:pz;P.s=parseFEN(P.pz.fen);P.sel=null;P.last=null;P.msg='';}
function puzzleGoal(){if(P.kind==='collect'){const left=P.s.b.filter(p=>p==='p').length;
    return {t:left?`Capture ${left} pawn${left>1?'s':''}`:(cur.promote&&!P.promoted?'Now promote your pawn':'Done!'),sub:`Best: ${P.par} moves`,n:P.moves,lab:'moves'};}
  const g=cur.goal;return {t:g==='check'?'Give check':g==='mate'?'Checkmate in one':P.pz.say,sub:g==='special'?'':'White to move',n:P.i+1,lab:`of ${cur.puzzles.length}`};}
function renderPuzzle(){const g=puzzleGoal(),s=P.s,sel=P.sel;
  const legal=sel!=null?legalMoves(s).filter(m=>m.from===sel):[];
  const dots=P.kind==='find'?`<div class="dots">${cur.puzzles.map((_,i)=>`<i class="${i<P.i?(P.hist[i]?'g':'r'):i===P.i?'now':''}"></i>`).join('')}</div>`:'';
  app.innerHTML=`${topbar(esc(cur.title),dots)}<div class="play">
    <div class="goalcard sheet"><div class="txt"><b>${esc(g.t)}</b><div class="muted">${esc(g.sub)}</div></div><div class="count">${g.n}<small>${g.lab}</small></div></div>
    ${boardHTML(s,{sel,targets:new Set(legal.map(m=>m.to)),epTarget:s.ep,last:P.last,check:inCheck(s,'b')?kingSq(s.b,'b'):-1})}
    <div class="status ${P.warn?'warn':''}">${P.msg||'&nbsp;'}</div>
    <div class="ctrls"><button class="btn" id="restart">Start again</button><button class="btn" id="hint">Hint</button><button class="link" id="relesson">Read the lesson</button></div></div>`;
  bindCommon();if(P.last&&P.anim){animateMove(P.last.from,P.last.to,false);P.anim=false;}
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('restart',startLevel);on('relesson',()=>go('lesson'));on('hint',puzzleHint);
  if(!P.done)bindBoard(s,'w',(m)=>puzzleMove(m),i=>{P.sel=i;render();},()=>P.sel);}
function puzzleHint(){let m;
  if(P.kind==='collect'){if(!legalMoves(P.s).length){P.msg='No moves left. Tap Start again.';P.warn=true;render();return;}m=legalMoves(P.s).filter(x=>x.cap)[0];if(!m){P.msg='Move your piece so it lines up with a pawn.';P.warn=false;render();return;}}
  else m=legalMoves(P.s).find(x=>findOk(x));
  if(m){P.sel=m.from;P.msg=`Try the ${PNAME[m.piece.toUpperCase()]} on ${sqName(m.from)}.`;P.warn=false;P.hinted=true;render();}}
function findOk(m){const n=makeMove(P.s,m),g=cur.goal;
  if(g==='check')return inCheck(n,'b');if(g==='mate')return inCheck(n,'b')&&!legalMoves(n).length;
  const need=P.pz.need;return need==='castle'?m.flag==='k'||m.flag==='q':need==='ep'?m.flag==='e':!!m.promo;}
function puzzleMove(m){
  if(P.done)return;
  if(P.kind==='collect'){P.s=nextTurnWhite(makeMove(P.s,m));P.moves++;P.last={from:m.from,to:m.to};P.anim=true;P.sel=null;P.msg='';m.cap?sfx.cap():sfx.move();
    if(m.promo){P.promoted=true;P.msg='Promoted!';}
    const left=P.s.b.filter(p=>p==='p').length;
    if(!left&&(!cur.promote||P.promoted)){P.done=true;render();const st=P.moves<=P.par?3:P.moves<=P.par+2?2:1,mv=P.moves,par=P.par,tok=P;return setTimeout(()=>{if(P===tok&&screen==='puzzle')finishLevel(st,'Lesson complete',`You did it in ${mv} moves. The best is ${par}.`);},450);}
    if(!legalMoves(P.s).length){P.msg='Your piece is stuck: no moves left. Tap Start again.';P.warn=true;}
    return render();}
  const ok=findOk(m);P.hist[P.i]=P.hist[P.i]??ok;
  if(ok){P.done=true;P.s=makeMove(P.s,m);P.last={from:m.from,to:m.to};P.anim=true;P.sel=null;P.warn=false;
    P.msg=cur.goal==='mate'?'Checkmate!':cur.goal==='check'?'Check!':pick(['Perfect.','Exactly right.']);inCheck(P.s)?sfx.check():sfx.good();render();
    const tok=P;setTimeout(()=>{if(screen!=='puzzle'||P!==tok)return;P.done=false;P.i++;if(P.i>=cur.puzzles.length){const errs=P.hist.filter(x=>!x).length;finishLevel(errs===0?3:errs===1?2:1,'Lesson complete',errs?`Solved, with ${errs} wrong tr${errs>1?'ies':'y'} on the way.`:'Every puzzle right first time!');}else{loadFind();render();}},1100);}
  else{sfx.bad();P.sel=null;P.warn=true;P.msg=cur.goal==='mate'?(inCheck(makeMove(P.s,m),'b')?'That is check, but the king can escape. Look again.':'That move isn\'t check. Look for a checkmate.'):cur.goal==='check'?'That doesn\'t attack the king. Try another move.':'Not this one. Read the hint above the board.';render();
    const el=app.querySelector(`[data-sq="${m.to}"]`);if(el)el.classList.add('err');}}

/* ---------- board input: tap-tap or drag ---------- */
function bindBoard(s,side,onMove,onSelect,getSel){const board=app.querySelector('.board');if(!board)return;
  const legal=legalMoves(s);let drag=null;
  const tryMove=(from,to)=>{const ms=legal.filter(m=>m.from===from&&m.to===to);if(!ms.length)return false;
    if(ms.length>1&&ms[0].promo){if(P&&screen==='puzzle'&&P.kind==='collect'){onMove(ms.find(m=>m.promo.toUpperCase()==='Q'));return true;}
      modalData={color:s.turn,done:p=>onMove(ms.find(m=>m.promo===p))};modal='promo';renderModal();return true;}
    onMove(ms[0]);return true;};
  const mine=i=>s.b[i]&&colorOf(s.b[i])===side&&s.turn===side;
  board.addEventListener('click',e=>{const b=e.target.closest('.sq');if(!b||drag&&drag.moved)return;const i=+b.dataset.sq,sel=getSel();
    if(sel!=null&&sel!==i&&tryMove(sel,i))return;
    if(mine(i))onSelect(sel===i?null:i);else if(sel!=null)onSelect(null);});
  board.addEventListener('pointerdown',e=>{const b=e.target.closest('.sq');if(!b)return;const i=+b.dataset.sq;if(!mine(i))return;
    drag={from:i,pc:b.querySelector('.pc'),x:e.clientX,y:e.clientY,moved:false};
    const mv=ev=>{if(!drag||!drag.pc)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<8)return;
      drag.moved=true;drag.pc.classList.add('drag');drag.pc.style.transform=`translate(${dx}px,${dy}px) scale(1.12)`;ev.preventDefault();};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      const d=drag;if(!d)return;if(!d.moved){drag=null;return;}setTimeout(()=>{drag=null;},0);
      if(d.pc){d.pc.classList.remove('drag');d.pc.style.transform='';}
      if(ev.type==='pointercancel')return;
      const el=document.elementFromPoint(ev.clientX,ev.clientY),t=el&&el.closest&&el.closest('.board .sq');
      if(t&&+t.dataset.sq!==d.from)tryMove(d.from,+t.dataset.sq);};
    addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);});}
/* ---------- full game ---------- */
const VALS={P:1,N:3,B:3,R:5,Q:9,K:0};
function startGame(o){clearSave();modal=null;
  G={mode:o.mode,diff:o.diff||1,you:o.mode==='2p'?'w':(o.you||'w'),lvl:o.lvl||null,start:o.start||START_FEN,moves:[],sans:[],states:[],keys:[],sel:null,over:null,thinking:false,hintMv:null};
  G.states=[parseFEN(G.start)];G.keys=[posKey(G.states[0])];G.flip=G.you==='b';
  if(o.moves)for(const mv of o.moves){const s=gs(),m=legalMoves(s).find(x=>x.from===mv.from&&x.to===mv.to&&(x.promo||null)===(mv.promo||null));if(!m)break;pushMove(m,true);}
  if(G.moves.length)saveGame();go('game');maybeAI();}
function resumeGame(){const sv=loadSave();if(!sv)return;startGame({mode:sv.mode,diff:sv.diff,you:sv.you,lvl:sv.lvl,start:sv.start,moves:sv.moves});if(sv.lvl)cur=LEVELS[sv.lvl-1];}
const gs=()=>G.states[G.states.length-1];
function pushMove(m,silent){const s=gs();G.sans.push(san(s,m));const n=makeMove(s,m);G.moves.push(m);G.states.push(n);G.keys.push(posKey(n));G.sel=null;G.hintMv=null;
  if(!silent){const st=gameStatus(n,G.keys);inCheck(n)?sfx.check():m.cap?sfx.cap():sfx.move();G.anim={from:m.from,to:m.to};if(st!=='play')return endGame(st);saveGame();}}
function maybeAI(){if(!G||G.over||G.mode!=='ai'||gs().turn===G.you)return;G.thinking=true;render();
  const id=G;setTimeout(()=>{if(G!==id||screen!=='game'||G.over)return;const m=bestMove(gs(),G.diff);G.thinking=false;if(m)pushMove(m);render();},380);}
function humanMove(m){if(G.over||G.thinking)return;pushMove(m);render();maybeAI();}
function undo(){if(G.thinking||G.over||G.moves.length===0)return;const back=G.mode==='ai'?(gs().turn===G.you?2:1):1;
  for(let i=0;i<back&&G.moves.length;i++){G.moves.pop();G.sans.pop();G.states.pop();G.keys.pop();}
  G.sel=null;G.hintMv=null;if(G.moves.length)saveGame();else clearSave();render();maybeAI();}
function hint(){if(G.over||G.thinking)return;G.thinking=true;render();const id=G;setTimeout(()=>{if(G!==id||screen!=='game')return;const m=bestMove(gs(),3);G.thinking=false;G.hintMv=m;G.sel=m?m.from:null;render();},60);}
function captured(color){/* pieces of `color` that were captured during this game */
  const order='QRBNP',out=G.moves.filter(m=>m.cap&&colorOf(m.cap)===color).map(m=>m.cap);
  return out.sort((a,b)=>order.indexOf(a.toUpperCase())-order.indexOf(b.toUpperCase()));}
function material(c){return gs().b.reduce((a,p)=>a+(p&&colorOf(p)===c?VALS[p.toUpperCase()]:0),0);}
const RES_TXT={checkmate:'Checkmate',stalemate:'Stalemate: no legal moves, so it\'s a draw.',draw50:'Draw by the 50-move rule.',material:'Draw: not enough pieces left to checkmate.',repetition:'Draw by repetition.',resign:'Resigned'};
function endGame(st,resigner){if(G.over)return;const s=gs();let res,title;
  if(st==='checkmate'){const winner=opp(s.turn);title=G.mode==='2p'?`${winner==='w'?'White':'Black'} wins!`:winner===G.you?'You win!':'The computer wins';res=G.mode==='2p'?'2p':winner===G.you?'win':'loss';}
  else if(st==='resign'){title=G.mode==='2p'?`${resigner==='w'?'Black':'White'} wins`:'You resigned';res=G.mode==='2p'?'2p':'loss';}
  else{title='Draw';res=G.mode==='2p'?'2p':'draw';}
  G.over={st,res,title};clearSave();
  if(G.mode==='ai'){recordResult('ai',res);recordResult('ai'+G.diff,res);if(G.lvl){cur=LEVELS[G.lvl-1];complete(G.lvl,res==='win'?3:res==='draw'?2:1);}}
  setTimeout(()=>{(res==='win'||res==='2p')?sfx.win():res==='loss'?sfx.lose():sfx.good();
    const stars=G.lvl?(res==='win'?3:res==='draw'?2:1):0;
    modalData={html:`<h2 class="result-txt">${esc(title)}</h2>${stars?`<div class="bigstars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}<p class="result-txt">${st==='checkmate'||st==='resign'?`${G.moves.length?`After ${Math.ceil(G.moves.length/2)} move${Math.ceil(G.moves.length/2)===1?'':'s'}.`:''}`:RES_TXT[st]}</p>
      <div class="row" style="justify-content:center"><button class="primary" id="again">Play again</button><button class="btn" id="review">Look at the board</button><button class="btn" id="tomenu">Menu</button></div>`,
      bind:ov=>{const on=(id,f)=>{const e=ov.querySelector('#'+id);if(e)e.onclick=f;};on('again',()=>startGame({mode:G.mode,diff:G.diff,you:G.mode==='ai'&&(progress.lastCol||'w')==='r'?pick(['w','b']):G.you,lvl:G.lvl}));on('review',()=>{modal=null;render();});on('tomenu',()=>{G=null;go('home');});}};
    modal='result';render();},600);}
function renderGame(){const s=gs(),you=G.mode==='2p'?s.turn:G.you,flip=G.flip;
  const sel=G.sel,legal=sel!=null?legalMoves(s).filter(m=>m.from===sel):[],last=G.moves.length?G.moves[G.moves.length-1]:null;
  const top=flip?'w':'b',bot=flip?'b':'w';
  const name=c=>G.mode==='2p'?(c==='w'?'White':'Black'):c===G.you?'You':`Computer <small>${DIFF[G.diff]}</small>`;
  const strip=(c,pos)=>{const caps=captured(opp(c)),adv=material(c)-material(opp(c));
    return `<div class="strip ${pos} ${!G.over&&s.turn===c?'turn':''}"><span class="who">${name(c)}</span><span class="caps">${caps.map(p=>pieceSVG(p)).join('')}${adv>0?`<span class="adv">+${adv}</span>`:''}</span></div>`;};
  const st=G.over?G.over.title:G.thinking?(G.mode==='ai'&&s.turn!==G.you?'Computer is thinking…':'Finding a good move…'):inCheck(s)?'Check!':G.hintMv?`Hint: ${san(s,G.hintMv)}`:G.mode==='2p'?`${s.turn==='w'?'White':'Black'} to move`:s.turn===G.you?'Your move':'';
  const sans=G.sans,list=[];for(let i=0;i<sans.length;i+=2)list.push([i/2+1,sans[i],sans[i+1]]);
  app.innerHTML=`${topbar(G.lvl?esc(LEVELS[G.lvl-1].title):G.mode==='2p'?'Two players':'vs Computer','',G.lvl?'levels':'menu')}
    <div class="play">${strip(top,'top')}
    ${boardHTML(s,{flip,sel,targets:new Set(legal.map(m=>m.to)),epTarget:s.ep,last,check:inCheck(s)?kingSq(s.b,s.turn):-1})}
    ${strip(bot,'bot')}
    <div class="side"><div class="status ${inCheck(s)&&!G.over?'warn':''}" aria-live="polite">${st||'&nbsp;'}</div>
      <div class="ctrls"><button class="btn" id="undo" ${!G.moves.length||G.thinking||G.over?'disabled':''}>Undo</button>${G.mode==='ai'?`<button class="btn" id="hint" ${G.over||G.thinking?'disabled':''}>Hint</button>`:''}<button class="btn" id="flip" aria-label="Flip board">Flip</button>
        ${G.over?'<button class="primary" id="newg">New game</button>':`<button class="btn" id="resign" ${G.thinking?'disabled':''}>Resign</button>`}</div>
      <div class="movesline">${list.map(([n,a,b])=>`<span><span class="n">${n}.</span> ${a}${b?' '+b:''}</span>`).join('')}</div>
      <div class="moves sheet"><ol>${list.map(([n,a,b])=>`<li><b>${a}</b>${b?`&nbsp;&nbsp;${b}`:''}</li>`).join('')||'<span class="muted">Moves appear here.</span>'}</ol></div></div></div>`;
  bindCommon();
  const ml=app.querySelector('.movesline');if(ml)ml.scrollLeft=ml.scrollWidth;const mv=app.querySelector('.moves');if(mv)mv.scrollTop=mv.scrollHeight;
  if(G.anim){animateMove(G.anim.from,G.anim.to,flip);G.anim=null;}
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('undo',undo);on('hint',hint);on('flip',()=>{G.flip=!G.flip;render();});
  on('resign',()=>{const b=document.getElementById('resign');if(b.dataset.armed)return endGame('resign',G.mode==='2p'?s.turn:G.you);b.dataset.armed=1;b.textContent='Sure?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Resign';}},2500);});
  on('newg',()=>{if(G.mode==='ai'){modal='newgame';render();}else startGame({mode:'2p'});});
  if(!G.over&&!G.thinking)bindBoard(s,you,humanMove,i=>{G.sel=i;G.hintMv=null;render();},()=>G.sel);}

/* ---------- start ---------- */
addEventListener('orientationchange',()=>setTimeout(()=>{sizeBoard();render();},250));
addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(()=>{if(screen!=='home'&&screen!=='levels'&&screen!=='lesson')render();},150);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&modal!=='welcome'&&modal!=='result'){modal=null;render();}});
sizeBoard();render();
}
</script>
</body>
</html>
